<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Orders — ΑΠΛΟ Audio</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="View your ΑΠΛΟ Audio orders, download files, and request revisions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Raleway:wght@400&display=swap">
<link rel="stylesheet" href="css/styles.css">
<style>
  .portal-wrap{ max-width:720px; margin:0 auto; padding:48px 24px 80px; }
  .portal-order{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:22px 24px; margin-bottom:18px; }
  .portal-order-top{ display:flex; justify-content:space-between; align-items:start; gap:12px; flex-wrap:wrap; }
  .portal-order-tier{ font-size:15px; font-weight:600; color:var(--paper); }
  .portal-order-meta{ font-size:13px; color:var(--color-felt-gray); margin-top:4px; }
  .portal-badge{ font-size:11px; letter-spacing:.06em; padding:4px 10px; border-radius:999px; border:1px solid var(--line); text-transform:uppercase; white-space:nowrap; }
  .badge-pending{ color:#f5a623; border-color:#f5a623; }
  .badge-paid{ color:#60a5fa; border-color:#60a5fa; }
  .badge-delivered{ color:#4ade80; border-color:#4ade80; }
  .portal-files{ margin-top:16px; padding-top:14px; border-top:1px solid var(--line); }
  .portal-file-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:9px 12px; margin-bottom:8px; font-size:13px; flex-wrap:wrap; }
  .portal-file-name{ color:var(--paper); }
  .portal-file-label{ color:var(--color-felt-gray); font-size:11px; margin-left:6px; }
  .portal-file-actions{ display:flex; gap:8px; align-items:center; }
  .portal-file-actions button, .portal-file-actions a{ font-size:12px; padding:5px 10px; border-radius:6px; border:1px solid var(--line); background:transparent; color:var(--paper); cursor:pointer; text-decoration:none; }
  .portal-file-actions button:hover, .portal-file-actions a:hover{ border-color:var(--color-obsidian); color:var(--color-obsidian); }
  .portal-revision{ margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
  .portal-revision textarea{ width:100%; min-height:70px; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--paper); font-size:14px; box-sizing:border-box; resize:vertical; margin-bottom:10px; }
  .portal-revision-toggle{ font-size:13px; color:var(--color-felt-gray); text-decoration:underline; cursor:pointer; }
  .login-box{ max-width:420px; margin:80px auto; text-align:center; }
  .login-box input{ width:100%; padding:12px 16px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--paper); font-size:15px; margin:10px 0; box-sizing:border-box; }
</style>
</head>
<body>

<nav class="site-nav">
  <div class="wrap">
    <a href="index.html" class="brand">
      <svg class="mark" viewBox="0 0 24 24" width="26" height="26"><circle cx="12" cy="12" r="11" fill="#000000"/><text x="12" y="16.5" text-anchor="middle" font-family="'Space Grotesk',system-ui,sans-serif" font-size="7" font-weight="600" fill="#0a0a0a">ΑΠΛ</text></svg>
      ΑΠΛΟ AUDIO
    </a>
    <div class="nav-links">
      <a href="index.html#samples">Samples</a>
      <a href="pricing.html">Pricing</a>
      <a href="why-aplo.html">Why ΑΠΛΟ</a>
      <a href="portal.html" class="nav-cta">My Orders</a>
    </div>
    <button class="nav-toggle" aria-label="Menu" aria-expanded="false">☰</button>
  </div>
</nav>

<main>
  <div id="login-view" class="login-box">
    <h2>Sign in to your orders</h2>
    <p class="hint">Enter the email you ordered with. We'll send you a 6-digit code — no password needed.</p>
    <input id="portal-email" type="email" placeholder="you@example.com" autocomplete="email">
    <button id="portal-send-code" class="btn btn-primary btn-block">Send me a code</button>
    <div id="portal-code-entry" style="display:none; margin-top:16px;">
      <input id="portal-code" type="text" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code">
      <button id="portal-verify-code" class="btn btn-primary btn-block">Verify</button>
      <p style="margin-top:10px;"><a href="#" id="portal-resend" style="color:inherit; text-decoration:underline; font-size:13px;">Resend code</a></p>
    </div>
    <p id="portal-login-msg" class="hint" style="display:none; margin-top:14px;"></p>
  </div>

  <div id="orders-view" class="portal-wrap" hidden>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
      <h2 style="margin:0;">Your orders</h2>
      <button id="portal-logout" class="btn btn-secondary" style="padding:8px 16px; font-size:13px;">Sign out</button>
    </div>
    <p id="orders-status" class="hint">Loading…</p>
    <div id="orders-list"></div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-grid">
      <a href="index.html" class="brand">
        <svg class="mark" viewBox="0 0 24 24" width="26" height="26"><circle cx="12" cy="12" r="11" fill="#000000"/><text x="12" y="16.5" text-anchor="middle" font-family="'Space Grotesk',system-ui,sans-serif" font-size="7" font-weight="600" fill="#0a0a0a">ΑΠΛ</text></svg>
        ΑΠΛΟ AUDIO
      </a>
      <div class="footer-links">
        <a href="index.html#samples">Samples</a>
        <a href="pricing.html">Pricing</a>
        <a href="checkout.html">Order</a>
        <a href="pricing.html#faq">FAQ</a>
      </div>
    </div>
    <div class="footer-meta">&copy; <span id="year"></span> ΑΠΛΟ AUDIO &nbsp;&middot;&nbsp; <a href="privacy.html" style="color:inherit;">Privacy</a> &nbsp;&middot;&nbsp; <a href="terms.html" style="color:inherit;">Terms</a></div>
  </div>
</footer>

<script src="js/main.js"></script>
<script src="js/portal.js"></script>
<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
